<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>JSON Practice</h1>
    <script>
        // This is a JS object (real, usable in code)
        const obj = { name: "Amit", age: 25 };
        console.log("obj", obj);
        // This is a JSON string (just text — looks similar, but it's a string)
        const jsonString = '{"name": "Amit", "age": 25}';
        console.log("json string", jsonString);
        // string → object
        const object1 = JSON.parse(jsonString);
        console.log(object1.name); // "Amit"
        console.log(typeof object1); // "object"

        // object-> string
        const user = { name: "Priya", age: 22 };

        const jsonString1 = JSON.stringify(user);
        console.log(jsonString1); // '{"name":"Priya","age":22}'
        console.log(typeof jsonString1); // "string"

        async function createPost() {
            try {
                const response = await fetch("https://jsonplaceholder.typicode.com/posts", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json", // tells the server "I'm sending JSON text"
                    },
                    body: JSON.stringify({          // convert your JS object → JSON string to send
                        title: "My first post",
                        body: "Learning fetch and JSON",
                        userId: 1,
                    }),
                });

                console.log(response);

                if (!response.ok) {
                    throw new Error(`HTTP error: ${response.status}`);
                }

                const data = await response.json(); // convert the server's JSON string response → JS object
                console.log(data);
            } catch (error) {
                console.log("Failed:", error.message);
            }
        }

        createPost();

    </script>
</body>

</html>
