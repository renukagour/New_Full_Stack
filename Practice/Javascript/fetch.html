<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Fetch API </h1>
    <p id="result"></p>
    <script>
        async function getUsers() {
            try {
                const response = await fetch("https://jsonplaceholder.typicode.com/users");
                if (!response.ok) {
                    throw new Error(`HTTP error: ${response.status}`);
                }
                console.log(response);
                console.log("status is ",response.status);
                const users = await response.json();
                console.log(users);
                const result=document.getElementById('result');
                console.log(users[0]);
                users.forEach(user => {
                    console.log("user in loop",user);
                    const userPara=document.createElement('p');
                    userPara.style.border='2px solid black';
                    userPara.style.padding='20px'
                    userPara.innerHTML=`User Id is ${user.id}<br>
                    User Name is <b>${user.name}</b><br>
                        User Email is <b>${user.email}</b><br>
                        User Address is <b>${user.address.street} ${user.address.zipcode}</b>  `;
                    result.append(userPara)
                });
                
            } catch (error) {
                console.log("Fetch failed:", error.message);
            }
        }

        getUsers();
    </script>
</body>

</html>
