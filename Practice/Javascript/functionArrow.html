const isEven=(n)=>{

}

const fullName=(first,last)=>{
    return first+" "+last;
}

const greetUser=(name = "Guest")=> {
  return "Welcome, " + name;
}

const sumArray=(arr)=> {
  let total = 0;
  for (let i = 0; i < arr.length; i++) {
    total += arr[i];
  }
  return total;
}
