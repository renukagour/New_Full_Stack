<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function fetchUser(id) {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    if (id === 1) {
                        resolve({ id: 1, name: "Amit" });
                    } else {
                        reject(new Error("User not found"));
                    }
                }, 2000);
            });
        }

        // async function getUser() {
        //     const user = await fetchUser(2);
        //     console.log(user);
        // }

        // getUser();
        // console.log("This runs first, before the async function finishes");

        /*output
        This runs first, before the async function finishes
        Uncaught (in promise) Error: User not found
        above error so try with try catch
        */
        async function getUser(id) {
            try {
                const user = await fetchUser(id);
                console.log(user);
             
            } catch (error) {
                console.log("Something went wrong:", error.message);
            }
        }

        getUser(1);
        getUser(2);
    </script>
</body>

</html>
