<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Fetch two API at once</h1>
    <div id="result"></div>
    <script>
        const result = document.getElementById('result');
        //   console.log(result);

        const getPikachu = async () => {
            try {
                const response2 = await fetch('https://pokeapi.co/api/v2/pokemon/pikachu');
                // console.log(response2);
                const pikachu = await response2.json();
                // console.log(pikachu);
                return pikachu;

            } catch (error) {
                console.log(error);
            }
        }
        const getData = async () => {
            try {
                const response1 = await fetch('https://jsonplaceholder.typicode.com/users');
                // console.log(response1);
                const users = await response1.json();
                // console.log(users);
                // console.log(users[0]);
                users.forEach(user => {
                    const pTag = document.createElement('p');
                    pTag.innerHTML = `Users Data is ${user.name} and ${user.email}`;
                    result.append(pTag);
                });
                const pika = await getPikachu();
                console.log(pika);
                const newData = {users:users,pikachu:pika};
                console.log("new Data: ", newData);
                const newDiv=document.createElement('p');
                newDiv.innerHTML=`New Data is ${JSON.stringify(newData)}`;
                result.append(newDiv)

            } catch (error) {
                console.log(error.message);
            }
        }
        getData();
    </script>
</body>

</html>
