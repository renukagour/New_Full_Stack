<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
    <!-- <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=sync_alt" /> -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=swap_horiz"
    />
  </head>

  <body>
    <div class="container">
      <h1 class="title">Currency Converter</h1>
      <form>
        <input type="text" placeholder="Enter Amount" id="amount" value="1" />
        <div id="dropdown">
          <div class="from">
            <label for="from">From</label>
            <img src="https://flagsapi.com/US/shiny/64.png" />
            <select name="from" id="from"></select>
          </div>

          <div>
            <span class="material-symbols-outlined"> swap_horiz </span>
          </div>
          <div class="to">
            <label for="to">To</label>
            <img src="https://flagsapi.com/IN/shiny/64.png" id="img" />
            <select name="to" id="to"></select>
          </div>
        </div>
        <div id="msg">1 INR=80USD</div>
        <button id="btn">Get Exchange Rates</button>
      </form>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
